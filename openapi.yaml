openapi: 3.0.3
info:
  title: Employee Management API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api/v1
paths:
  /employees:
    get:
      summary: List all employees
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: department
          schema: { type: string }
      responses:
        '200':
          description: List of employees
    post:
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '201':
          description: Employee created
        '422':
          description: Validation error
  /employees/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      summary: Get one employee
      responses:
        '200':
          description: The employee
        '404':
          description: Not found
    put:
      summary: Update an employee
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
        '422':
          description: Validation error
    delete:
      summary: Delete an employee
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found
components:
  schemas:
    EmployeeInput:
      type: object
      required: [first_name, last_name, email, department, position]
      properties:
        first_name: { type: string, example: Juan }
        last_name:  { type: string, example: Dela Cruz }
        email:      { type: string, format: email, example: juan@example.com }
        department: { type: string, example: IT }
        position:   { type: string, example: Programmer }